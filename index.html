<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14102b">
<title>Stack Rush</title>
<style>
  :root{--ink:#fff;--mute:#ffffffa8;--glass:#150d33cc;--line:#ffffff22;--gold:#ffc83d;--pink:#ff5fa2;--violet:#7c5cff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#14102b;color:var(--ink);overflow:hidden;
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #ui{position:fixed;inset:0;pointer-events:none}
  .hidden{display:none!important}
  /* HUD */
  #hud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;padding:0 14px;display:flex;justify-content:space-between;align-items:flex-start}
  #hudR{display:flex;gap:8px}
  .pill{pointer-events:auto;background:#0006;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;color:#fff;backdrop-filter:blur(6px);cursor:pointer;font-family:inherit}
  #coins{cursor:default}
  #scoreWrap{position:absolute;top:44px;left:0;right:0;text-align:center;pointer-events:none}
  #score{font-size:72px;font-weight:900;line-height:1;text-shadow:0 4px 18px #0008,0 0 2px #0008;letter-spacing:-1px}
  #combo{height:26px;margin-top:2px;font-size:20px;font-weight:900;color:var(--gold);text-shadow:0 2px 10px #0009;letter-spacing:1px}
  #aux{height:30px;font-size:24px;font-weight:900;text-shadow:0 2px 10px #0009;letter-spacing:2px}
  #aux .heart{color:#ff4d6d}
  #aux .lost{opacity:.28}
  #aux.low{color:#ff6b6b;animation:pulse .5s ease-in-out infinite}
  #ghostD{height:20px;font-size:14px;font-weight:800;color:var(--mute);text-shadow:0 2px 8px #0009}
  #ghostD.up{color:#7dff9b}
  #ghostD.down{color:#ff9b9b}
  #tip{position:absolute;left:0;right:0;top:60%;text-align:center;font-weight:900;font-size:26px;letter-spacing:3px;text-shadow:0 3px 14px #000a;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  #toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translate(-50%,20px);opacity:0;background:#000c;border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;max-width:90vw;transition:.25s;z-index:5}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  /* screens */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 20px;pointer-events:auto;
    background:radial-gradient(ellipse at 50% 30%,#150d3388,#0a0620cc);backdrop-filter:blur(3px);overflow:auto;touch-action:pan-y}
  .screen::before,.screen::after{content:"";margin:auto}
  .logo{margin:0;display:flex;flex-direction:column;align-items:center;line-height:.86;font-size:68px;font-weight:900;letter-spacing:-2px;
    filter:drop-shadow(0 6px 18px #0008)}
  .logo span:first-child{background:linear-gradient(180deg,#fff,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo span:last-child{background:linear-gradient(180deg,#ff8ad0,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{margin:2px 0 10px;color:var(--mute);font-weight:700}
  .btn{pointer-events:auto;border:0;border-radius:16px;padding:13px 24px;font:inherit;font-weight:900;font-size:17px;color:#fff;background:#ffffff1f;border:1px solid var(--line);cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(180deg,#ffb23d,#ff6a3d);color:#2a0d00;border:0;box-shadow:0 6px 0 #a63d14,0 14px 24px #0007}
  .btn.primary:active{box-shadow:0 2px 0 #a63d14,0 6px 12px #0007;transform:translateY(4px)}
  .btn.big{font-size:26px;padding:16px 56px;letter-spacing:2px}
  .btn.gold{background:linear-gradient(180deg,#ffe27a,#ffb300);color:#2e1c00;border:0;box-shadow:0 4px 0 #9a6a00}
  .btn[disabled],.btn.off{opacity:.45}
  .card{width:min(360px,100%);background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left}
  .card h3{margin:0 0 6px;font-size:13px;letter-spacing:2px;color:var(--mute)}
  .stats{display:flex;gap:24px;font-weight:800;color:var(--mute)}
  .stats b{color:#fff;font-size:20px;margin-left:4px}
  .bar{width:min(360px,100%);height:10px;border-radius:99px;background:#ffffff22;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5fa2,#ffc83d);border-radius:99px;transition:width .5s}
  .big-score{font-size:96px;font-weight:900;line-height:1;text-shadow:0 6px 24px #0008}
  .label{letter-spacing:4px;font-weight:800;color:var(--mute);font-size:13px}
  .newbest{color:var(--gold);font-weight:900;letter-spacing:3px;animation:pulse 1s infinite}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .sub{color:var(--mute);font-weight:700;text-align:center}
  .sub b{color:#fff}
  h2{margin:0;font-size:26px;letter-spacing:2px}
  /* themes sheet */
  #tGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(420px,100%)}
  .th{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
  .th.eq{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .sw{height:64px;border-radius:10px;position:relative;overflow:hidden;margin-bottom:8px}
  .sw span{position:absolute;bottom:6px;height:9px;border-radius:3px;left:50%}
  .th b{display:block;font-size:15px}
  .th .btn{margin-top:6px;padding:7px 10px;font-size:13px;width:100%;border-radius:11px}
  /* modes */
  #mGrid{display:flex;flex-direction:column;gap:10px;width:min(400px,100%)}
  .mode{pointer-events:auto;display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:13px 16px;color:#fff;font:inherit;cursor:pointer}
  .mode:active{transform:scale(.98)}
  .mode i{font-style:normal;font-size:32px}
  .mode div{flex:1}
  .mode b{display:block;font-size:19px}
  .mode span{color:var(--mute);font-size:13px;font-weight:700}
  .mode em{font-style:normal;font-weight:900;color:var(--gold);font-size:13px;text-align:right}
  /* awards */
  #aList{display:flex;flex-direction:column;gap:8px;width:min(400px,100%)}
  .aw{display:flex;gap:12px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  .aw i{font-style:normal;font-size:26px;filter:grayscale(1);opacity:.5}
  .aw.on{border-color:var(--gold)}
  .aw.on i{filter:none;opacity:1}
  .aw b{display:block}
  .aw span{font-size:12px;color:var(--mute);font-weight:700}
  .aw em{font-style:normal;margin-left:auto;font-weight:900;color:var(--gold);font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div id="coins" class="pill">🪙 <span id="coinN">0</span></div>
    <div id="hudR"><button id="endZen" class="pill hidden">Finish</button><button id="mute" class="pill" aria-label="Sound">🔊</button></div>
  </div>
  <div id="scoreWrap" class="hidden"><div id="score">0</div><div id="combo"></div><div id="aux"></div><div id="ghostD"></div></div>
  <div id="tip" class="hidden">TAP TO DROP</div>
  <div id="toast"></div>

  <section id="menu" class="screen">
    <h1 class="logo"><span>STACK</span><span>RUSH</span></h1>
    <p class="tag">Time it right. Build it high.</p>
    <button id="play" class="btn primary big">PLAY</button>
    <div class="row"><button id="openThemes" class="btn">🎨 Themes</button><button id="openAwards" class="btn">🏆 Awards</button></div>
    <div class="card" id="dailyCard"></div>
    <div class="stats"><div>BEST<b id="mBest">0</b></div><div>LEVEL<b id="mLvl">1</b></div><div>🪙<b id="mCoins">0</b></div></div>
    <div class="bar"><i id="mXp"></i></div>
  </section>

  <section id="modes" class="screen hidden">
    <h2>CHOOSE MODE</h2>
    <div id="mGrid"></div>
    <button id="closeModes" class="btn">Back</button>
  </section>

  <section id="over" class="screen hidden">
    <div class="label" id="oLabel">SCORE</div>
    <div class="big-score" id="oScore">0</div>
    <div class="newbest hidden" id="oNew">★ NEW BEST ★</div>
    <div class="sub" id="oBest"></div>
    <div class="sub" id="oCoins"></div>
    <div class="sub" id="oLevel"></div>
    <button id="revive" class="btn gold hidden"></button>
    <button id="again" class="btn primary big">AGAIN</button>
    <div class="row"><button id="toMenu" class="btn">Menu</button><button id="overModes" class="btn">Modes</button><button id="overThemes" class="btn">🎨 Themes</button></div>
  </section>

  <section id="themes" class="screen hidden">
    <h2>THEMES</h2>
    <div class="sub">Level <b id="tLvl">1</b> · 🪙 <b id="tCoins">0</b></div>
    <div id="tGrid"></div>
    <button id="closeThemes" class="btn">Back</button>
  </section>

  <section id="awards" class="screen hidden">
    <h2>AWARDS</h2>
    <div class="sub" id="aCount"></div>
    <div id="aList"></div>
    <button id="closeAwards" class="btn">Back</button>
  </section>
</div>

<script>
(() => {
'use strict';

/* ================= Config ================= */
const CFG = {
  BH: 34,                // block height (px at 400px width)
  baseSpeed: 0.42,       // screen-widths per second
  ramp: 0.012,           // speed increase per block
  maxSpeed: 1.8,
  perfectPx: 9,          // tolerance for a PERFECT drop
  regrowAfter: 4,        // consecutive perfects before the block grows back
  regrowPct: 0.07,
  maxW: 300,
  startFrac: 0.62,
  reviveCost: 40,
  dailyGoal: 12,
  dailyBonus: 50,
  milestone: 25,
  timedSeconds: 60, timedBonus: 2, timedCap: 90, timedMissPenalty: 3,
  bombChance: 0.26, bombTtl: 2.8, bombDodgePts: 2,
  zenMinFrac: 0.3
};

/* Square payment links for premium themes (see README). Leave empty until created. */
const SQUARE_LINKS = { gold: "", galaxy: "", cyber: "" };

/* ================= Modes ================= */
const MODES = {
  classic:{name:'Classic',icon:'🏗️',desc:'One life. Climb as high as you can.',lives:1,revive:true,ghost:true},
  timed:{name:'Timed Rush',icon:'⏱️',desc:'60 seconds. Perfect drops add time.',lives:1,timer:true,ghost:true},
  lives:{name:'Lives',icon:'❤️',desc:'3 lives. Only a full miss costs one.',lives:3,revive:true,ghost:true},
  hazard:{name:'Hazard',icon:'💣',desc:"Bombs slide by. Don't drop on them!",lives:3,bombs:true,revive:true,ghost:true},
  zen:{name:'Zen',icon:'🧘',desc:'No speed-up, no fail. Just stack.',lives:99,ramp:false,coins:false,ghost:false}
};

/* ================= Themes ================= */
const THEMES = {
  sunset:{name:'Sunset',unlock:{t:'free'},bg:['#2b1a63','#a1306b','#ff8f3d'],sun:'rgba(255,196,120,.6)',hill:['#3c1a55','#26103c'],ground:'#1c0c30',h0:338,hr:66,hs:.3,s:88,l:60},
  neon:{name:'Neon',unlock:{t:'level',n:3},bg:['#05010f','#0b0630','#1a0752'],sun:'rgba(120,90,255,.45)',hill:['#12062e','#0a0320'],ground:'#070217',h0:0,hr:360,hs:.2,s:100,l:58,glow:true},
  ocean:{name:'Ocean',unlock:{t:'level',n:5},bg:['#052a4d','#0b5f93','#35bccf'],sun:'rgba(200,252,255,.55)',hill:['#07395f','#052a4a'],ground:'#031f39',h0:182,hr:60,hs:.3,s:85,l:58,amb:{type:'bubbles',n:26}},
  forest:{name:'Forest',unlock:{t:'level',n:7},bg:['#06221a','#14532d','#7bbf6a'],sun:'rgba(230,255,170,.5)',hill:['#0f3d2a','#0a2c1f'],ground:'#07231a',h0:95,hr:70,hs:.3,s:55,l:55,amb:{type:'fireflies',hue:70,n:30}},
  desert:{name:'Desert',unlock:{t:'coins',n:250},bg:['#7c3a1d','#e08a3d','#ffd98a'],sun:'rgba(255,240,190,.75)',hill:['#a8531f','#7f3a14'],ground:'#5a2a10',h0:18,hr:36,hs:.28,s:70,l:62,amb:{type:'sand',n:26}},
  ice:{name:'Ice',unlock:{t:'level',n:9},bg:['#0a2540','#3b82b8','#cfeeff'],sun:'rgba(255,255,255,.65)',hill:['#7fb2d6','#5a93bd'],ground:'#2d5f86',h0:195,hr:40,hs:.3,s:70,l:74,amb:{type:'snow',n:46}},
  candy:{name:'Candy',unlock:{t:'coins',n:150},bg:['#4a1a78','#c54aa9','#ffb6da'],sun:'rgba(255,232,250,.65)',hill:['#702b92','#541f7c'],ground:'#3b1262',h0:305,hr:70,hs:.35,s:90,l:68},
  lava:{name:'Lava',unlock:{t:'coins',n:300},bg:['#140404','#5c0f0a','#ff5a1f'],sun:'rgba(255,150,60,.6)',hill:['#2a0a08','#1a0605'],ground:'#0f0302',h0:2,hr:50,hs:.3,s:95,l:55,glow:true,amb:{type:'embers',hue:20,n:40}},
  sakura:{name:'Sakura',unlock:{t:'coins',n:350},bg:['#3a1c4a','#c9689b','#ffd1dc'],sun:'rgba(255,240,245,.7)',hill:['#7a3a6a','#5a2a52'],ground:'#3a1a40',h0:335,hr:30,hs:.3,s:80,l:78,amb:{type:'petals',n:32}},
  retro:{name:'Retro',unlock:{t:'level',n:12},bg:['#1a1c2c','#5d275d','#b13e53'],sun:'rgba(255,205,117,.5)',hill:['#29366f','#1a1c2c'],ground:'#0e0f1c',h0:20,hr:200,hs:.5,s:75,l:58,pixel:true,scan:true},
  deepsea:{name:'Deep Sea',unlock:{t:'level',n:15},bg:['#00060f','#021b3a','#06518c'],sun:'rgba(40,200,255,.35)',hill:['#02152e','#010c1c'],ground:'#010812',h0:195,hr:50,hs:.3,s:90,l:58,glow:true,amb:{type:'fireflies',hue:190,n:34}},
  winter:{name:'Winter Night',unlock:{t:'coins',n:400},bg:['#0b1330','#27407a','#a9c4f0'],sun:'rgba(255,230,180,.55)',hill:['#e8f1ff','#c8d9f2'],ground:'#dbe7f7',h0:200,hr:40,hs:.3,s:70,l:76,amb:{type:'snow',n:60}},
  gold:{name:'Gold Rush',unlock:{t:'iap',price:'$1.00'},bg:['#0b0b0b','#1e1709','#3d2c0b'],sun:'rgba(255,205,90,.4)',hill:['#251b08','#170f04'],ground:'#0d0902',h0:38,hr:16,hs:.3,s:92,l:56,glow:true,amb:{type:'fireflies',hue:45,n:26}},
  galaxy:{name:'Galaxy',unlock:{t:'iap',price:'$1.00'},bg:['#02010a','#150a37','#2c1062'],sun:'rgba(175,115,255,.5)',hill:['#1b0c3f','#0f0626'],ground:'#080321',h0:250,hr:90,hs:.3,s:85,l:62,stars:2},
  cyber:{name:'Cyber City',unlock:{t:'iap',price:'$1.00'},bg:['#050510','#0a1a3a','#1b0a4a'],sun:'rgba(0,255,220,.35)',hill:['#0a0f2a','#060a1c'],ground:'#04060f',h0:170,hr:140,hs:.35,s:100,l:55,glow:true,amb:{type:'matrix',n:34}}
};
const SPACE = ['#04020d','#0f0828','#1c0f45'];

/* ================= Achievements ================= */
const ACH = [
  {id:'first',icon:'👋',name:'First Drop',desc:'Finish your first game',coins:10,test:()=>S.played>=1},
  {id:'t20',icon:'🏢',name:'Getting Tall',desc:'Stack 20 blocks in one run',coins:15,test:x=>x.height>=20},
  {id:'t50',icon:'🏙️',name:'Skyscraper',desc:'Stack 50 blocks in one run',coins:30,test:x=>x.height>=50},
  {id:'t100',icon:'☁️',name:'Beyond the Clouds',desc:'Stack 100 blocks in one run',coins:60,test:x=>x.height>=100},
  {id:'c5',icon:'🎯',name:'In the Zone',desc:'5 perfect drops in a row',coins:10,test:x=>x.combo>=5},
  {id:'c10',icon:'✨',name:'Perfectionist',desc:'10 perfect drops in a row',coins:25,test:x=>x.combo>=10},
  {id:'c25',icon:'💎',name:'Flawless',desc:'25 perfect drops in a row',coins:60,test:x=>x.combo>=25},
  {id:'p100',icon:'👁️',name:'Sharp Eyes',desc:'100 perfect drops total',coins:30,test:()=>S.perfects>=100},
  {id:'p500',icon:'🦅',name:'Eagle Eye',desc:'500 perfect drops total',coins:80,test:()=>S.perfects>=500},
  {id:'rush',icon:'⚡',name:'Speed Demon',desc:'Score 60 in Timed Rush',coins:40,test:x=>x.mode==='timed'&&x.score>=60},
  {id:'bomb',icon:'🧯',name:'Bomb Squad',desc:'Dodge 10 bombs total',coins:30,test:()=>S.dodged>=10},
  {id:'zen',icon:'🧘',name:'Zen Master',desc:'Stack 40 blocks in Zen',coins:20,test:x=>x.mode==='zen'&&x.height>=40},
  {id:'life',icon:'🩹',name:'Back From the Brink',desc:'Use a revive',coins:15,test:()=>S.revives>=1},
  {id:'col5',icon:'🎨',name:'Collector',desc:'Own 5 themes',coins:40,test:()=>S.owned.length>=5},
  {id:'col10',icon:'🖼️',name:'Curator',desc:'Own 10 themes',coins:100,test:()=>S.owned.length>=10},
  {id:'st3',icon:'🔥',name:'On a Roll',desc:'3-day login streak',coins:20,test:()=>S.streak>=3},
  {id:'st7',icon:'📅',name:'Dedicated',desc:'7-day login streak',coins:60,test:()=>S.streak>=7},
  {id:'l5',icon:'⭐',name:'Rising Star',desc:'Reach level 5',coins:25,test:()=>levelOf(S.blocks)>=5},
  {id:'l10',icon:'🌟',name:'Veteran',desc:'Reach level 10',coins:75,test:()=>levelOf(S.blocks)>=10},
  {id:'rich',icon:'🐷',name:'Piggy Bank',desc:'Hold 500 coins',coins:0,test:()=>S.coins>=500}
];

/* ================= Save data ================= */
const DEF = {best:0,bests:{},ghosts:{},ach:{},coins:0,blocks:0,perfects:0,played:0,revives:0,dodged:0,
             owned:['sunset'],theme:'sunset',mute:false,lastMode:'classic',
             lastClaim:'',streak:0,daily:{day:'',perfects:0,done:false},seenTip:false};
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('stackrush.v2')||'{}'); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem('stackrush.v2', JSON.stringify(v)); }catch(e){} }
};
const S = Object.assign({}, DEF, store.get());
if(!Array.isArray(S.owned) || !S.owned.length) S.owned = ['sunset'];
if(!THEMES[S.theme] || !S.owned.includes(S.theme)) S.theme = 'sunset';
if(!S.bests || typeof S.bests!=='object') S.bests={};
if(!S.ghosts || typeof S.ghosts!=='object') S.ghosts={};
if(!S.ach || typeof S.ach!=='object') S.ach={};
if(S.best && !S.bests.classic) S.bests.classic=S.best;
if(!MODES[S.lastMode]) S.lastMode='classic';
const save = () => store.set(S);

const pad = n => String(n).padStart(2,'0');
const dayStr = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => dayStr();
const yesterday = () => { const d=new Date(); d.setDate(d.getDate()-1); return dayStr(d); };
if(!S.daily || S.daily.day !== today()) S.daily = {day:today(), perfects:0, done:false};

/* return from checkout: ?unlock=gold */
try{
  const u = new URLSearchParams(location.search).get('unlock');
  if(u && THEMES[u] && THEMES[u].unlock.t==='iap' && !S.owned.includes(u)){ S.owned.push(u); S.theme=u; }
}catch(e){}
save();

const levelOf = b => Math.floor(Math.sqrt(b/12)) + 1;
const levelStart = L => 12*(L-1)*(L-1);

/* ================= Helpers ================= */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);
const TH = () => THEMES[S.theme];
function hue(th,i){ return (((th.h0 + th.hr*(.5+.5*Math.sin(i*th.hs))) % 360) + 360) % 360; }
const hsl = (h,s,l,a=1) => `hsla(${h.toFixed(1)},${s}%,${l}%,${a})`;
function popEl(el,scale=1.22,ms=170){ try{ el.animate([{transform:`scale(${scale})`},{transform:'scale(1)'}],{duration:ms,easing:'ease-out'}); }catch(e){} }
const tq=[]; let tBusy=false;
function toast(msg,ms=2200){ tq.push([msg,ms]); if(!tBusy) nextToast(); }
function nextToast(){
  const it=tq.shift(); if(!it){ tBusy=false; return; }
  tBusy=true; const el=$('toast'); el.textContent=it[0]; el.classList.add('show');
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(nextToast,260); }, it[1]);
}

/* ================= Audio ================= */
let ac=null, master=null;
function audio(){
  if(S.mute) return null;
  if(!ac){
    try{ const C=window.AudioContext||window.webkitAudioContext; ac=new C(); master=ac.createGain(); master.gain.value=.55; master.connect(ac.destination); }
    catch(e){ return null; }
  }
  if(ac.state==='suspended') ac.resume();

}
function tone(f,d=.15,type='sine',v=.25,slide=0,delay=0){
  const a=audio(); if(!a) return;
  const t0=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.03);
}

  fail(){ tone(280,.55,'sawtooth',.16,-220); tone(120,.5,'sine',.32,-70,.05); },

function updateAmb(dt){

    switch(a.type){
      case 'snow': q.y+=(26+q.v*38)*u*dt; q.x+=Math.sin(t*.9+q.p)*14*u*dt; if(q.y>H+8){q.y=-8;q.x=Math.random()*W;} break;
      case 'embers': q.y-=(30+q.v*70)*u*dt; q.x+=Math.sin(t+q.p)*18*u*dt; if(q.y<-8){q.y=H+8;q.x=Math.random()*W;} break;
      case 'fireflies': q.x+=Math.cos(t*.5+q.p)*16*u*dt; q.y+=Math.sin(t*.4+q.p*1.7)*14*u*dt;
        if(q.x<-10)q.x=W+10; if(q.x>W+10)q.x=-10; if(q.y<-10)q.y=H+10; if(q.y>H+10)q.y=-10; break;
      case 'bubbles': q.y-=(24+q.v*40)*u*dt; q.x+=Math.sin(t*1.3+q.p)*12*u*dt; if(q.y<-12){q.y=H+12;q.x=Math.random()*W;} break;
      case 'petals': q.y+=(30+q.v*34)*u*dt; q.x+=(Math.sin(t*.7+q.p)*26+16)*u*dt;
        if(q.y>H+10){q.y=-10;q.x=Math.random()*W;} if(q.x>W+10)q.x=-10; break;

function drop(){
  if(state!=='playing' || !cur) return;

  $('tip').classList.add('hidden');

  const top=stack[stack.length-1];
  let left=Math.max(cur.x,top.x), right=Math.min(cur.x+cur.w,top.x+top.w);

  const dx=cur.x-top.x;
  const perfect=Math.abs(dx)<=CFG.perfectPx*u;
  let nb;
  if(perfect){
    combo++; perfectsRun++; bestCombo=Math.max(bestCombo,combo);
    let w=top.w, x=top.x;
    if(combo>=CFG.regrowAfter && w<baseW){ const g=Math.min(baseW-w, baseW*CFG.regrowPct); w+=g; x-=g/2; x=clamp(x,0,W-w); }
    nb={x,w,y:cur.y,i:cur.i,sq:1};
    score+=1+Math.min(combo,8);
    const cx=x+w/2, ty=cur.y+BH;
    rings.push({x,y:ty,w,life:1});
    burst(cx,ty,hue(TH(),cur.i),14+Math.min(combo,10)*2,260*u);
    floatText(cx,ty+8,combo>1?`PERFECT x${combo}`:'PERFECT',22*u,'#ffe27a');

    if(mode==='timed'){ timeLeft=Math.min(CFG.timedCap,timeLeft+CFG.timedBonus); texts.push({x:W/2,y:ty+50,vy:70,text:`+${CFG.timedBonus}s`,size:26*u,color:'#7dff9b',life:1}); }

      save();
    }
  } else {
    combo=0;
    if(mode==='zen' && ov<baseW*CFG.zenMinFrac){ ov=baseW*CFG.zenMinFrac; left=clamp(top.x+top.w/2-ov/2,0,W-ov); }
    nb={x:left,w:ov,y:cur.y,i:cur.i,sq:.6};
    const cut=cur.w-(right-Math.max(cur.x,top.x));
    if(cut>1){
      const px = dx<0 ? cur.x : right;
      pieces.push({x:px,y:cur.y,w:cut,vx:(dx<0?-1:1)*rand(30,80)*u,vy:60,rot:0,vr:(dx<0?-1:1)*rand(1,3),i:cur.i,a:1});

function endRun(reason){

  state='over'; $('tip').classList.add('hidden');

  const prevLvl=levelOf(S.blocks);
  S.blocks+=runBlocks; S.coins+=earned; S.perfects+=perfectsRun; S.played++;
  const prevBest=S.bests[mode]||0;

  if(newBest){
    S.bests[mode]=score; if(mode==='classic') S.best=score;

  }
  const lvl=levelOf(S.blocks), unlocked=[]; let lvBonus=0;

/* ================= Update ================= */
function update(dt){
  t+=dt;
  if((state==='playing'||state==='menu') && cur){
    cur.x+=dir*speed()*dt;
    if(cur.x<0){ cur.x=0; dir=1; }
    if(cur.x+cur.w>W){ cur.x=W-cur.w; dir=-1; }
    if(state==='playing' && cur.bomb){
      cur.ttl-=dt;
      if(cur.ttl<=0){
        S.dodged=(S.dodged||0)+1; score+=CFG.bombDodgePts; setScore(score); sfx.dodge(); vib(15);
        const bx=cur.x+cur.w/2; floatText(bx,cur.y+BH+10,`DODGED +${CFG.bombDodgePts}`,22*u,'#7dff9b');
        runRec.scores[runRec.scores.length-1]=score;
        cur=null; save(); checkAch(); spawnCur(true);
      }
    }
  }
  if(state==='playing' && mode==='timed' && timerOn){
    const before=Math.ceil(timeLeft);
    timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; setAux(true); endRun('time'); }
    else { if(timeLeft<=5 && Math.ceil(timeLeft)!==before) sfx.tick(); setAux(); }
  }
  for(const b of stack) if(b.sq>0) b.sq=Math.max(0,b.sq-dt*4);
  const target=Math.max(0, stack.length*BH - H*.35);
  cam+=(target-cam)*Math.min(1,dt*5);
  shake*=Math.pow(.002,dt); if(shake<.2) shake=0;
  flash=Math.max(0,flash-dt*1.4);
  for(const p of pieces){ p.vy-=1500*dt; p.y+=p.vy*dt; p.x+=p.vx*dt; p.rot+=p.vr*dt; p.a=Math.max(0,p.a-dt*.6); }
  pieces=pieces.filter(p=>Y(p.y)<H+200 && p.a>0);
  for(const p of parts){ p.vy-=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=p.dec*dt; }
  parts=parts.filter(p=>p.life>0);
  for(const r of rings) r.life-=dt*2.2;
  rings=rings.filter(r=>r.life>0);
  for(const tx of texts){ tx.y+=tx.vy*dt; tx.vy*=Math.pow(.2,dt); tx.life-=dt*.9; }
  texts=texts.filter(x=>x.life>0);
  if(banner){ banner.life-=dt*.7; if(banner.life<=0) banner=null; }
  updateAmb(dt);
}

/* ================= Draw ================= */
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function text(s,x,y,size,color,alpha=1){
  ctx.save(); ctx.globalAlpha=alpha; ctx.font=`900 ${size}px ui-rounded,"SF Pro Rounded",system-ui,sans-serif`;
  ctx.textAlign='center'; ctx.lineJoin='round'; ctx.lineWidth=size*.2; ctx.strokeStyle='rgba(0,0,0,.5)';
  ctx.strokeText(s,x,y); ctx.fillStyle=color; ctx.fillText(s,x,y); ctx.restore();
}
function drawBG(){
  const th=TH();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,th.bg[0]); g.addColorStop(.55,th.bg[1]); g.addColorStop(1,th.bg[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const alt=cam/BH, space=clamp((alt-7)/45,0,1);
  if(space>0){
    const g2=ctx.createLinearGradient(0,0,0,H);
    g2.addColorStop(0,SPACE[0]); g2.addColorStop(.6,SPACE[1]); g2.addColorStop(1,SPACE[2]);
    ctx.globalAlpha=space; ctx.fillStyle=g2; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  const sy=baseLine-H*.25+cam*.35;
  if(sy<H+W){
    const sg=ctx.createRadialGradient(W*.72,sy,0,W*.72,sy,W*.7);
    sg.addColorStop(0,th.sun); sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalAlpha=1-space*.7; ctx.fillStyle=sg; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  const sa=clamp(.18+space*.9,0,1)*(th.stars||1);
  for(const s of stars){
    const yy=((s.y*H*1.3 - cam*s.k*.3)%(H*1.3)+H*1.3)%(H*1.3);
    if(yy>H) continue;
    const tw=.55+.45*Math.sin(t*2+s.p);
    ctx.globalAlpha=clamp(sa*tw,0,1); ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x*W,yy,s.r*u,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(let L=0;L<2;L++){
    const yb=baseLine+(L?18:-14)*u+cam*(L?.55:.35);
    if(yb>H+80) continue;
    ctx.fillStyle=th.hill[L]; ctx.beginPath(); ctx.moveTo(0,H+10);
    for(let x=0;x<=W+20;x+=16){ ctx.lineTo(x,yb-(Math.sin(x*.011+L*2)*20+Math.sin(x*.029+L)*9)*u); }
    ctx.lineTo(W,H+10); ctx.closePath(); ctx.fill();
  }
  const gy=Y(0);
  if(gy<H){ ctx.fillStyle=th.ground; ctx.fillRect(0,gy,W,H-gy+4); ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(0,gy,W,2*u); }
  drawAmb();
}
function drawGhost(){
  if(!ghost || state==='menu') return;
  const n=ghost.blocks.length;
  ctx.save(); ctx.setLineDash([5*u,4*u]); ctx.lineWidth=1.5*u;
  ctx.fillStyle='rgba(255,255,255,.07)'; ctx.strokeStyle='rgba(255,255,255,.3)';
  for(let i=1;i<n;i++){
    const sy=Y(i*BH+BH);
    if(sy>H+BH||sy<-BH) continue;
    const g=ghost.blocks[i];
    rr(g.x*W,sy,g.w*W,BH-2,6*u); ctx.fill(); ctx.stroke();
  }
  const ly=Y(n*BH);
  if(ly>-20 && ly<H+20){
    ctx.strokeStyle='rgba(255,214,90,.7)'; ctx.lineWidth=2*u; ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(W,ly); ctx.stroke();
    ctx.setLineDash([]); ctx.font=`900 ${12*u}px ui-rounded,system-ui,sans-serif`; ctx.textAlign='right'; ctx.fillStyle='rgba(255,214,90,.95)';
    ctx.fillText(`BEST ${ghost.score}`,W-10,ly-6*u);
  }
  ctx.restore();
}
function drawBlock(b,alpha=1){
  const sy=Y(b.y+BH);
  if(sy>H+BH || sy<-BH*2) return;
  const th=TH(), h=hue(th,b.i);
  ctx.save(); ctx.globalAlpha=alpha;
  if(b.sq>0){ const k=b.sq, cx=b.x+b.w/2, by=sy+BH; ctx.translate(cx,by); ctx.scale(1+.07*k,1-.14*k); ctx.translate(-cx,-by); }
  if(th.pixel){
    const px=Math.max(2,Math.round(3*u));
    ctx.fillStyle='#0e0f1c'; ctx.fillRect(b.x-px,sy-px,b.w+px*2,BH-2+px*2-px);
    ctx.fillStyle=hsl(h,th.s,th.l); ctx.fillRect(b.x,sy,b.w,BH-2-px);
    ctx.fillStyle=hsl(h,th.s,th.l+16); ctx.fillRect(b.x,sy,b.w,px*1.5);
    ctx.fillStyle=hsl(h,th.s,th.l-16); ctx.fillRect(b.x,sy+BH-2-px*3,b.w,px*2);
  } else {
    const g=ctx.createLinearGradient(0,sy,0,sy+BH);
    g.addColorStop(0,hsl(h,th.s,th.l+12)); g.addColorStop(1,hsl(h,th.s,th.l-10));
    if(th.glow){ ctx.shadowColor=hsl(h,100,60,.9); ctx.shadowBlur=16*u; }
    ctx.fillStyle=g; rr(b.x,sy,b.w,BH-2,7*u); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.26)'; rr(b.x+4*u,sy+3*u,Math.max(0,b.w-8*u),5*u,3*u); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.17)'; rr(b.x+2*u,sy+BH-2-7*u,Math.max(0,b.w-4*u),5*u,3*u); ctx.fill();
  }
  ctx.restore();
}
function drawBomb(b){
  const sy=Y(b.y+BH);
  const pulse=.5+.5*Math.sin(t*14);
  ctx.save();
  ctx.shadowColor=`rgba(255,60,60,${.5+.5*pulse})`; ctx.shadowBlur=18*u;
  const g=ctx.createLinearGradient(0,sy,0,sy+BH); g.addColorStop(0,'#3a3a46'); g.addColorStop(1,'#15151c');
  ctx.fillStyle=g; rr(b.x,sy,b.w,BH-2,7*u); ctx.fill(); ctx.shadowBlur=0;
  // hazard stripes
  ctx.save(); rr(b.x,sy,b.w,BH-2,7*u); ctx.clip();
  ctx.fillStyle=`rgba(255,${60+pulse*60|0},40,.85)`;
  for(let x=b.x-BH;x<b.x+b.w+BH;x+=22*u){ ctx.beginPath(); ctx.moveTo(x,sy+BH); ctx.lineTo(x+10*u,sy+BH); ctx.lineTo(x+10*u+BH,sy); ctx.lineTo(x+BH,sy); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.lineWidth=2*u; ctx.strokeStyle=`rgba(255,${90+pulse*100|0},80,1)`; rr(b.x,sy,b.w,BH-2,7*u); ctx.stroke();
  ctx.font=`${BH*.85}px system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('💣',b.x+b.w/2,sy+BH/2);
  // time-left bar
  const k=clamp(b.ttl/CFG.bombTtl,0,1);
  ctx.fillStyle='rgba(255,255,255,.85)'; rr(b.x+4*u,sy-6*u,(b.w-8*u)*k,3*u,2*u); ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0) ctx.translate(rand(-shake,shake),rand(-shake,shake));
  drawBG();
  drawGhost();
  for(const b of stack) drawBlock(b);
  for(const p of pieces){
    const sy=Y(p.y+BH); ctx.save(); ctx.translate(p.x+p.w/2,sy+BH/2); ctx.rotate(p.rot);
    ctx.translate(-(p.x+p.w/2),-(sy+BH/2)); drawBlock({x:p.x,y:p.y,w:p.w,i:p.i,sq:0},p.a); ctx.restore();
  }
  if(cur){ if(cur.bomb) drawBomb(cur); else drawBlock(cur); }
  for(const r of rings){
    const k=1-r.life, sy=Y(r.y);
    ctx.save(); ctx.globalAlpha=r.life*.9; ctx.strokeStyle='#fff'; ctx.lineWidth=3*u*r.life+1;
    rr(r.x-k*18*u,sy-BH-k*10*u,r.w+k*36*u,BH+k*14*u,8*u); ctx.stroke(); ctx.restore();
  }
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    ctx.globalAlpha=clamp(p.life,0,1); ctx.fillStyle=hsl(p.h,95,62);
    ctx.beginPath(); ctx.arc(p.x,Y(p.y),p.s*clamp(p.life+.3,0,1),0,6.283); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  for(const tx of texts) text(tx.text,tx.x,Y(tx.y),tx.size,tx.color,clamp(tx.life*1.4,0,1));
  if(banner){
    const k=1-banner.life; text(banner.text,W/2,H*.3-k*30,(40+Math.sin(k*3.1)*14)*u,'#fff',clamp(banner.life*2,0,1));
  }
  ctx.restore();
  if(TH().scan){ if(!scanPat) scanPat=ctx.createPattern(scanCv,'repeat'); ctx.fillStyle=scanPat; ctx.fillRect(0,0,W,H); }
  if(flash>0){ ctx.fillStyle=`rgba(255,255,255,${flash})`; ctx.fillRect(0,0,W,H); }
}

let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||.016); last=ts;
  update(dt); draw(); requestAnimationFrame(loop);
}

/* ================= Menu / UI ================= */
function hideAll(){ for(const id of ['menu','over','themes','modes','awards']) $(id).classList.add('hidden'); }
function renderMenu(){
  const lvl=levelOf(S.blocks), a=levelStart(lvl), b=levelStart(lvl+1);
  $('mBest').textContent=S.bests[S.lastMode]||0; $('mLvl').textContent=lvl; $('mCoins').textContent=S.coins;
  $('mXp').style.width=(clamp((S.blocks-a)/(b-a),0,1)*100)+'%';
  const claimed=S.lastClaim===today();
  const reward=20+10*Math.min(claimed?S.streak-1:(S.lastClaim===yesterday()?S.streak:0),6);
  const prog=Math.min(S.daily.perfects,CFG.dailyGoal);
  $('dailyCard').innerHTML=
    `<h3>DAILY</h3>`+
    (claimed
      ? `<div class="sub" style="text-align:left">🔥 Streak: <b>${S.streak}</b> day${S.streak===1?'':'s'} — come back tomorrow for more</div>`
      : `<div class="row" style="justify-content:space-between;align-items:center"><div class="sub">🔥 Day <b>${S.lastClaim===yesterday()?S.streak+1:1}</b> reward</div><button class="btn gold" data-act="claim" style="padding:8px 16px;font-size:15px">Claim +${reward} 🪙</button></div>`)+
    `<div class="sub" style="margin-top:8px;text-align:left">${S.daily.done?'✅':'🎯'} Land <b>${CFG.dailyGoal}</b> perfect drops: <b>${prog}/${CFG.dailyGoal}</b></div>`+
    `<div class="bar" style="width:100%;margin-top:6px"><i style="width:${prog/CFG.dailyGoal*100}%"></i></div>`;
}
function claimDaily(){
  if(S.lastClaim===today()) return;
  S.streak = (S.lastClaim===yesterday()) ? S.streak+1 : 1;
  S.lastClaim=today();
  const reward=20+10*Math.min(S.streak-1,6);
  S.coins+=reward; save(); sfx.coin(); toast(`+${reward} 🪙  ·  ${S.streak}-day streak!`); renderMenu(); setCoins(); checkAch();
}
function showMenu(){
  state='menu'; demoStack(); hideAll(); $('menu').classList.remove('hidden');
  $('hud').classList.remove('hidden'); $('scoreWrap').classList.add('hidden'); $('tip').classList.add('hidden'); $('endZen').classList.add('hidden');
  setCoins(); renderMenu(); setGhostD();
}
function showModes(){
  hideAll(); $('modes').classList.remove('hidden');
  $('mGrid').innerHTML=Object.entries(MODES).map(([id,m])=>
    `<button class="mode" data-mode="${id}"><i>${m.icon}</i><div><b>${m.name}</b><span>${m.desc}</span></div><em>BEST<br>${S.bests[id]||0}</em></button>`).join('');
}
let themesFrom='menu';
function openThemes(from){ themesFrom=from; hideAll(); $('themes').classList.remove('hidden'); renderThemes(); }
function closeThemes(){ if(themesFrom==='over' && state==='over'){ hideAll(); $('over').classList.remove('hidden'); } else showMenu(); }
function renderThemes(){
  const lvl=levelOf(S.blocks);
  $('tLvl').textContent=lvl; $('tCoins').textContent=S.coins;
  $('tGrid').innerHTML=Object.entries(THEMES).map(([id,th])=>{
    const own=S.owned.includes(id), eq=S.theme===id;
    const chips=[0,1,2,3,4].map(k=>`<span style="width:${14+k*2}px;margin-left:${-40+k*16}px;background:${hsl(hue(th,k*3),th.s,th.l)}"></span>`).join('');
    let btn;
    if(own) btn=eq?`<button class="btn" disabled>✓ Equipped</button>`:`<button class="btn" data-act="equip" data-id="${id}">Equip</button>`;
    else if(th.unlock.t==='level') btn=`<button class="btn off" data-act="lock" data-id="${id}">🔒 Level ${th.unlock.n}</button>`;
    else if(th.unlock.t==='coins') btn=`<button class="btn${S.coins>=th.unlock.n?' gold':' off'}" data-act="coin" data-id="${id}">🪙 ${th.unlock.n}</button>`;
    else btn=`<button class="btn gold" data-act="iap" data-id="${id}">${th.unlock.price}</button>`;
    return `<div class="th${eq?' eq':''}"><div class="sw" style="background:linear-gradient(180deg,${th.bg[0]},${th.bg[1]},${th.bg[2]})">${chips}</div><b>${th.name}</b>${btn}</div>`;
  }).join('');
}
function themeAction(act,id){
  const th=THEMES[id]; if(!th) return;
  if(act==='equip'){ S.theme=id; save(); initAmb(); sfx.tap(); renderThemes(); }
  else if(act==='lock'){ toast(`Reach level ${th.unlock.n} to unlock ${th.name}`); }
  else if(act==='coin'){
    if(S.coins<th.unlock.n){ toast(`Need ${th.unlock.n} 🪙 — you have ${S.coins}`); return; }
    S.coins-=th.unlock.n; S.owned.push(id); S.theme=id; save(); initAmb(); sfx.up(); setCoins(); renderThemes(); checkAch();
  }
  else if(act==='iap'){
    if(!SQUARE_LINKS[id]){ toast('Store is not connected yet'); return; }
    location.href=SQUARE_LINKS[id];
  }
}
function showAwards(){
  hideAll(); $('awards').classList.remove('hidden');
  const n=ACH.filter(a=>S.ach[a.id]).length;
  $('aCount').innerHTML=`<b>${n}</b> / ${ACH.length} unlocked`;
  $('aList').innerHTML=ACH.map(a=>`<div class="aw${S.ach[a.id]?' on':''}"><i>${a.icon}</i><div><b>${a.name}</b><span>${a.desc}</span></div>${a.coins?`<em>+${a.coins} 🪙</em>`:''}</div>`).join('');
}

/* ================= Input ================= */
addEventListener('pointerdown',e=>{
  audio();
  if(e.target.closest('button, .screen')) return;
  drop();
});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(state==='playing') drop(); }
});
$('play').onclick=()=>{ sfx.tap(); showModes(); };
$('closeModes').onclick=()=>{ sfx.tap(); if(state==='over'){ hideAll(); $('over').classList.remove('hidden'); } else showMenu(); };
$('mGrid').addEventListener('click',e=>{ const b=e.target.closest('[data-mode]'); if(b){ sfx.tap(); startMode(b.dataset.mode); } });
$('again').onclick=()=>{ sfx.tap(); startMode(mode); };
$('toMenu').onclick=()=>{ sfx.tap(); showMenu(); };
$('overModes').onclick=()=>{ sfx.tap(); showModes(); };
$('revive').onclick=revive;
$('openThemes').onclick=()=>{ sfx.tap(); openThemes('menu'); };
$('overThemes').onclick=()=>{ sfx.tap(); openThemes('over'); };
$('closeThemes').onclick=()=>{ sfx.tap(); closeThemes(); };
$('openAwards').onclick=()=>{ sfx.tap(); showAwards(); };
$('closeAwards').onclick=()=>{ sfx.tap(); showMenu(); };
$('endZen').onclick=()=>{ if(state==='playing' && mode==='zen') endRun('zen'); };
$('mute').onclick=()=>{ S.mute=!S.mute; save(); setMuteIcon(); if(!S.mute) sfx.tap(); };
$('dailyCard').addEventListener('click',e=>{ if(e.target.closest('[data-act=claim]')) claimDaily(); });
$('tGrid').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b) themeAction(b.dataset.act,b.dataset.id); });
addEventListener('resize',resize);

/* test hook: only with #debug in the URL */
if(location.hash==='#debug'){
  window.__sr={ get state(){return state;}, get mode(){return mode;}, get cur(){return cur;}, get top(){return stack[stack.length-1];},
    get score(){return score;}, get combo(){return combo;}, get lives(){return lives;}, get timeLeft(){return timeLeft;},
    get ghost(){return ghost;}, get S(){return S;}, get W(){return W;}, get stackLen(){return stack.length;},
    startMode, setTheme(id){ if(!S.owned.includes(id)) S.owned.push(id); S.theme=id; initAmb(); },
    setTime(v){ timeLeft=v; }, forceNarrow(){ const tp=stack[stack.length-1]; tp.w=30; tp.x=W/2-15; if(cur){ cur.w=30; } },
    ACH, THEMES, MODES };
}

resize(); setMuteIcon(); showMenu(); requestAnimationFrame(loop);
})();
</script>
